{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
  <div class="max-w-md mx-auto rounded-xl border border-white/10 bg-white/5 p-6">
    <h1 class="text-2xl font-bold mb-4">Sign In</h1>
    {% if form.errors %}
      <p role="alert" class="text-red-300 mb-3">Please correct the error below.</p>
    {% endif %}
    <form method="post" action="" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_username" class="block text-sm text-white/70 mb-1">Username</label>
        <input type="text" name="username" id="id_username" required class="w-full rounded-md bg-white/10 border border-white/20 px-3 py-2 text-white" />
      </div>
      <div>
        <label for="id_password" class="block text-sm text-white/70 mb-1">Password</label>
        <input type="password" name="password" id="id_password" required class="w-full rounded-md bg-white/10 border border-white/20 px-3 py-2 text-white" />
      </div>
      <button class="inline-flex items-center rounded-md bg-happy text-white font-semibold px-4 py-2" type="submit">Sign In</button>
    </form>
  </div>
{% endblock %}
