{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <div class="card">
    <h1 class="text-2xl font-bold" style="color: var(--brand-primary);">Welcome to Happyness</h1>
    <p class="text-secondary mt-2">If you can see this page, your Django templates and static files are wired up correctly.</p>

    <div class="mt-4 flex gap-3 items-start">
      <button id="helloBtn" class="btn btn-primary">Click me</button>
      <p id="helloMsg" class="hidden"></p>
    </div>

    <div class="mt-6">
      <button
        class="btn btn-secondary"
        hx-get="/htmx/greeting/"
        hx-target="#htmx-target"
        hx-swap="innerHTML"
      >Load greeting (HTMX)</button>
      <div id="htmx-target" class="mt-3 text-secondary"></div>
    </div>
  </div>
{% endblock %}
