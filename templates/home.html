{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <div class="rounded-xl border border-white/10 bg-white/5 p-6">
    <h1 class="text-2xl font-bold text-brand">Welcome to Happyness</h1>
    <p class="text-white/70 mt-2">If you can see this page, your Django templates and static files are wired up correctly.</p>

    <div class="mt-4 flex gap-3 items-start">
      <button id="helloBtn" class="inline-flex items-center rounded-md bg-brand text-black font-semibold px-4 py-2">Click me</button>
      <p id="helloMsg" class="hidden"></p>
    </div>

    <div class="mt-6">
      <button
        class="inline-flex items-center rounded-md bg-happy text-white font-semibold px-4 py-2"
        hx-get="/htmx/greeting/"
        hx-target="#htmx-target"
        hx-swap="innerHTML"
      >Load greeting (HTMX)</button>
      <div id="htmx-target" class="mt-3 text-white/80"></div>
    </div>
  </div>
{% endblock %}
