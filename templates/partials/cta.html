<section class="py-24 relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-r from-[var(--brand-primary)] to-[var(--brand-secondary)] opacity-90"></div>
    <div class="absolute inset-0 opacity-20" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
    
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative text-center" data-aos="zoom-in">
        <h2 class="text-4xl md:text-5xl font-bold text-white mb-6">Ready to Make a Difference?</h2>
        <p class="text-xl text-white text-opacity-90 mb-10 leading-relaxed">
            Join thousands of volunteers who are already changing lives. Whether you have an hour or a lifetime to give, there's a place for you here.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            {% if not user.is_authenticated %}
            <a href="{% url 'account_signup' %}" class="btn bg-white text-[var(--brand-primary)] hover:bg-gray-100 text-lg px-8 py-4 shadow-lg font-bold border-none">
                Sign Up Now
            </a>
            {% endif %}
            <a href="{% url 'about' %}" class="btn border-2 border-white text-white hover:bg-white hover:text-[var(--brand-primary)] text-lg px-8 py-4 font-bold">
                Contact Us
            </a>
        </div>
    </div>
</section>
